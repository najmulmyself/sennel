<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<x-import component="IOSDevice" from="./ios-frame.jsx" dark="{{ dark }}" hint-size="402px,874px">
  <div style="--bg:{{ bg }}; --card:{{ card }}; --stage:{{ stage }}; --tp:{{ tp }}; --ts:{{ ts }}; --hair:{{ hair }}; --soft:{{ soft }}; height:100%; box-sizing:border-box; background:var(--bg); padding:58px 0 30px; display:flex; flex-direction:column; font-family:-apple-system,system-ui,sans-serif; overflow:hidden;">

    <div style="padding:6px 22px 14px;">
      <div style="font-size:34px; font-weight:700; letter-spacing:-.01em; color:var(--tp);">Health</div>
      <div style="font-size:15px; color:var(--ts); margin-top:2px;">Your body, recovering.</div>
    </div>

    <div style="margin:0 22px 18px; border-radius:22px; background:var(--card); border:1px solid var(--hair); padding:16px 18px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.04);">
      <div style="display:flex; flex-direction:column; gap:3px;">
        <div style="font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ts);">Milestones</div>
        <div style="font-size:20px; font-weight:700; color:var(--tp);">5 of 7 reached</div>
      </div>
      <div style="display:flex; gap:5px;">
        <span style="width:9px; height:9px; border-radius:50%; background:var(--stage);"></span>
        <span style="width:9px; height:9px; border-radius:50%; background:var(--stage);"></span>
        <span style="width:9px; height:9px; border-radius:50%; background:var(--stage);"></span>
        <span style="width:9px; height:9px; border-radius:50%; background:var(--stage);"></span>
        <span style="width:9px; height:9px; border-radius:50%; background:var(--stage);"></span>
        <span style="width:9px; height:9px; border-radius:50%; background:var(--hair);"></span>
        <span style="width:9px; height:9px; border-radius:50%; background:var(--hair);"></span>
      </div>
    </div>

    <div style="flex:1; overflow:hidden; padding:0 22px;">
      <sc-for list="{{ rows }}" as="m" hint-placeholder-count="7">
        <div style="display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--hair);">
          <div style="width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:{{ m.iconBg }}; border:{{ m.iconBorder }};">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 21c5-2 8-6 8-11V5l-8-2-8 2v5c0 5 3 9 8 11z" fill="{{ m.leafFill }}" stroke="{{ m.leafStroke }}" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 6v9M9 9l3 3 3-3" stroke="{{ m.veinStroke }}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
            <div style="font-size:16px; font-weight:600; color:{{ m.titleCol }};">{{ m.title }}</div>
            <div style="font-size:13px; color:var(--ts);">{{ m.detail }}</div>
          </div>
          <div style="font-size:13px; font-weight:600; color:{{ m.timeCol }}; text-align:right;">{{ m.time }}</div>
        </div>
      </sc-for>
    </div>
  </div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const stage = dark ? '#34D399' : '#0D9488';
    const bg = dark ? '#0B1410' : '#FAFAF9';
    const card = dark ? '#13201C' : '#FFFFFF';
    const tp = dark ? '#ECFDF5' : '#0F172A';
    const ts = dark ? '#9CA8A4' : '#64748B';
    const hair = dark ? 'rgba(255,255,255,0.09)' : 'rgba(15,23,42,0.08)';
    const soft = dark ? 'rgba(52,211,153,0.16)' : 'rgba(13,148,136,0.10)';

    const data = [
      ['20 minutes', 'Heart rate & blood pressure settle', '20 min', true],
      ['1 hour', 'Restlessness begins to ease', '1 hr', true],
      ['1 day', 'Nicotine has left your bloodstream', '1 day', true],
      ['3 days', 'Breathing feels noticeably easier', '3 days', true],
      ['1 week', 'Taste and smell start to sharpen', '1 wk', true],
      ['1 month', 'Gum tissue begins to heal', '1 mo', false],
      ['3 months', 'Circulation meaningfully improves', '3 mo', false],
    ];
    const rows = data.map(([title, detail, time, done]) => ({
      title, detail, time, done,
      iconBg: done ? stage : 'transparent',
      iconBorder: done ? 'none' : `1.5px solid ${hair}`,
      leafFill: done ? 'rgba(255,255,255,0.9)' : 'transparent',
      leafStroke: done ? 'rgba(255,255,255,0.9)' : ts,
      veinStroke: done ? stage : ts,
      titleCol: tp,
      timeCol: done ? stage : ts,
    }));
    return { dark, bg, card, stage, tp, ts, hair, soft, rows };
  }
}
</script>
</body>
</html>
