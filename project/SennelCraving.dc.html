<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<x-import component="IOSDevice" from="./ios-frame.jsx" dark="{{ dark }}" hint-size="402px,874px">
  <div style="--bg:{{ bg }}; --card:{{ card }}; --stage:{{ stage }}; --tp:{{ tp }}; --ts:{{ ts }}; --hair:{{ hair }}; --soft:{{ soft }}; --track:{{ track }}; height:100%; box-sizing:border-box; background:var(--bg); padding:58px 22px 30px; display:flex; flex-direction:column; gap:18px; font-family:-apple-system,system-ui,sans-serif; overflow:hidden;">

    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
      <div style="min-width:0;">
        <div style="font-size:32px; font-weight:700; letter-spacing:-.01em; line-height:1.1; color:var(--tp);">Log a craving</div>
        <div style="font-size:15px; color:var(--ts); margin-top:5px;">No judgment — just noticing.</div>
      </div>
      <div style="font-size:16px; font-weight:600; color:var(--stage); flex-shrink:0; padding-top:4px;">Cancel</div>
    </div>

    <div style="border-radius:24px; background:var(--card); border:1px solid var(--hair); padding:20px; display:flex; flex-direction:column; gap:14px;">
      <div style="display:flex; align-items:baseline; justify-content:space-between;">
        <div style="font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ts);">Intensity</div>
        <div style="font-size:15px; font-weight:600; color:var(--stage);">Strong</div>
      </div>
      <div style="display:flex; align-items:flex-end; gap:10px; height:64px;">
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="5">
          <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
            <div style="width:100%; border-radius:8px; background:{{ b.col }}; height:{{ b.h }};"></div>
            <div style="font-size:13px; font-weight:600; color:{{ b.labelCol }};">{{ b.n }}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:11px;">
      <div style="font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ts);">What triggered it?</div>
      <div style="display:flex; flex-wrap:wrap; gap:9px;">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="8">
          <div style="padding:10px 16px; border-radius:99px; font-size:15px; font-weight:500; background:{{ c.bg }}; color:{{ c.col }}; border:1px solid {{ c.border }};">{{ c.label }}</div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:11px;">
      <div style="font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ts);">What happened?</div>
      <div style="display:flex; gap:10px;">
        <div style="flex:1; border-radius:16px; padding:15px; text-align:center; background:var(--stage); color:{{ btnText }}; font-size:16px; font-weight:600; box-shadow:0 6px 16px var(--soft);">I rode it out</div>
        <div style="flex:1; border-radius:16px; padding:15px; text-align:center; background:transparent; color:var(--ts); font-size:16px; font-weight:600; border:1px solid var(--hair);">I used one</div>
      </div>
    </div>

    <div style="flex:1;"></div>

    <div style="border-radius:18px; background:var(--soft); padding:14px 16px; display:flex; align-items:center; gap:12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;"><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="{{ stage }}" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="4" stroke="{{ stage }}" stroke-width="2"/></svg>
      <div style="font-size:14px; color:var(--tp); line-height:1.35;">Most of your cravings hit around <b>2–4 PM</b>. They usually pass in under 5 minutes.</div>
    </div>

    <button style="border:none; cursor:pointer; width:100%; border-radius:18px; padding:18px; background:var(--stage); color:{{ btnText }}; font-family:inherit; font-size:17px; font-weight:600; box-shadow:0 8px 22px var(--soft);">Save craving</button>
  </div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const stage = dark ? '#2DD4BF' : '#0D9488';
    const bg = dark ? '#0B1410' : '#FAFAF9';
    const card = dark ? '#13201C' : '#FFFFFF';
    const tp = dark ? '#ECFDF5' : '#0F172A';
    const ts = dark ? '#9CA8A4' : '#64748B';
    const hair = dark ? 'rgba(255,255,255,0.10)' : 'rgba(15,23,42,0.08)';
    const soft = dark ? 'rgba(45,212,191,0.16)' : 'rgba(13,148,136,0.10)';
    const track = dark ? 'rgba(255,255,255,0.08)' : 'rgba(15,23,42,0.07)';
    const sel = 3;
    const heights = ['34%', '52%', '72%', '90%', '100%'];
    const bars = [1, 2, 3, 4, 5].map((n, i) => ({
      n: String(n), h: heights[i],
      col: n <= sel ? stage : track,
      labelCol: n === sel ? stage : ts,
    }));
    const chipData = [['After meals', true], ['Coffee', true], ['Stress', false], ['Boredom', false], ['Driving', false], ['Social', false], ['Alcohol', false], ['Phone', false]];
    const chips = chipData.map(([label, on]) => ({
      label,
      bg: on ? stage : 'transparent',
      col: on ? (dark ? '#04120C' : '#fff') : ts,
      border: on ? stage : hair,
    }));
    return { dark, bg, card, stage, tp, ts, hair, soft, track, bars, chips, btnText: dark ? '#04120C' : '#FFFFFF' };
  }
}
</script>
</body>
</html>
