<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<x-import component="IOSDevice" from="./ios-frame.jsx" dark="{{ dark }}" hint-size="402px,874px">
  <div style="--bg:{{ bg }}; --card:{{ card }}; --stage:{{ stage }}; --tp:{{ tp }}; --ts:{{ ts }}; --hair:{{ hair }}; --soft:{{ soft }}; --glass:{{ glass }}; --shine:{{ shine }}; position:relative; height:100%; box-sizing:border-box; background:var(--bg); font-family:-apple-system,system-ui,sans-serif; overflow:hidden;">

    <div style="position:absolute; inset:0; padding:58px 22px 0; filter:blur(7px); opacity:.85; pointer-events:none;">
      <div style="font-size:34px; font-weight:700; color:var(--tp);">Insights</div>
      <div style="font-size:15px; color:var(--ts); margin:2px 0 18px;">Last 30 days</div>
      <div style="border-radius:22px; background:var(--card); border:1px solid var(--hair); padding:18px; margin-bottom:14px;">
        <div style="font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--ts); margin-bottom:14px;">Pouches per day</div>
        <div style="display:flex; align-items:flex-end; gap:8px; height:96px;">
          <div style="flex:1; height:80%; border-radius:6px; background:var(--soft);"></div>
          <div style="flex:1; height:64%; border-radius:6px; background:var(--soft);"></div>
          <div style="flex:1; height:70%; border-radius:6px; background:var(--soft);"></div>
          <div style="flex:1; height:48%; border-radius:6px; background:var(--stage);"></div>
          <div style="flex:1; height:52%; border-radius:6px; background:var(--soft);"></div>
          <div style="flex:1; height:34%; border-radius:6px; background:var(--stage);"></div>
          <div style="flex:1; height:26%; border-radius:6px; background:var(--stage);"></div>
        </div>
      </div>
      <div style="border-radius:22px; background:var(--card); border:1px solid var(--hair); padding:18px; display:flex; justify-content:space-between;">
        <div><div style="font-size:13px; color:var(--ts);">Top trigger</div><div style="font-size:20px; font-weight:700; color:var(--tp);">After meals</div></div>
        <div><div style="font-size:13px; color:var(--ts);">Avg craving</div><div style="font-size:20px; font-weight:700; color:var(--tp);">3.2 / 5</div></div>
      </div>
    </div>

    <div style="position:absolute; inset:0; background:linear-gradient(180deg, transparent, var(--scrim) 38%);"></div>

    <div style="position:absolute; left:16px; right:16px; bottom:22px; border-radius:30px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.18); border:1px solid var(--hair);">
      <div style="position:absolute; inset:0; background:var(--glass); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);"></div>
      <div style="position:absolute; inset:0; box-shadow:inset 0 1px 0 var(--shine); border-radius:30px; pointer-events:none;"></div>
      <div style="position:relative; padding:26px 24px 22px; display:flex; flex-direction:column; gap:16px;">

        <div style="display:flex; align-items:center; gap:12px;">
          <div style="width:46px; height:46px; border-radius:14px; background:var(--stage); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px var(--soft);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.8" opacity=".5"/><path d="M12 4a8 8 0 016.9 12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="19" cy="8" r="2.4" fill="#fff"/></svg>
          </div>
          <div>
            <div style="font-size:20px; font-weight:700; color:var(--tp);">Unlock the full picture</div>
            <div style="font-size:14px; color:var(--ts);">Your core tools stay free, forever.</div>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:11px;">
          <sc-for list="{{ feats }}" as="f" hint-placeholder-count="4">
            <div style="display:flex; align-items:center; gap:11px;">
              <div style="width:22px; height:22px; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-11" stroke="{{ stage }}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <div style="font-size:15px; color:var(--tp);">{{ f }}</div>
            </div>
          </sc-for>
        </div>

        <button style="border:none; cursor:pointer; width:100%; border-radius:16px; padding:17px; background:var(--stage); color:{{ btnText }}; font-size:17px; font-weight:600; font-family:inherit; box-shadow:0 8px 22px var(--soft);">
          Go Premium — $3.99/month
        </button>

        <div style="display:flex; align-items:center; justify-content:center; gap:18px;">
          <span style="font-size:13px; color:var(--ts);">Restore Purchases</span>
          <span style="width:3px; height:3px; border-radius:50%; background:var(--ts);"></span>
          <span style="font-size:13px; color:var(--ts);">Maybe later</span>
        </div>
      </div>
    </div>
  </div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const stage = dark ? '#2DD4BF' : '#0D9488';
    const bg = dark ? '#0B1410' : '#FAFAF9';
    const card = dark ? '#13201C' : '#FFFFFF';
    const tp = dark ? '#ECFDF5' : '#0F172A';
    const ts = dark ? '#9CA8A4' : '#64748B';
    const hair = dark ? 'rgba(255,255,255,0.10)' : 'rgba(15,23,42,0.08)';
    const soft = dark ? 'rgba(45,212,191,0.18)' : 'rgba(13,148,136,0.12)';
    return {
      dark, bg, card, stage, tp, ts, hair, soft,
      scrim: dark ? '#0B1410' : '#FAFAF9',
      glass: dark ? 'rgba(19,32,28,0.72)' : 'rgba(255,255,255,0.62)',
      shine: dark ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.85)',
      btnText: dark ? '#04120C' : '#FFFFFF',
      feats: ['Full history & weekly charts', 'Craving & trigger analysis', 'Withdrawal symptom log', 'Breathing exercises, widgets & badges'],
    };
  }
}
</script>
</body>
</html>
