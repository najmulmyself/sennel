<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<x-import component="IOSDevice" from="./ios-frame.jsx" dark="{{ dark }}" hint-size="402px,874px">
  <div style="--bg:{{ bg }}; --card:{{ card }}; --stage:{{ stage }}; --tp:{{ tp }}; --ts:{{ ts }}; --hair:{{ hair }}; --soft:{{ soft }}; height:100%; box-sizing:border-box; background:var(--bg); padding:58px 22px 30px; display:flex; flex-direction:column; gap:18px; font-family:-apple-system,system-ui,sans-serif; overflow:hidden;">

    <div>
      <div style="font-size:34px; font-weight:700; letter-spacing:-.01em; color:var(--tp);">Withdrawal</div>
      <div style="font-size:15px; color:var(--ts); margin-top:2px;">Symptoms easing over time.</div>
    </div>

    <div style="border-radius:24px; background:var(--card); border:1px solid var(--hair); padding:18px 16px;">
      <div style="display:flex; align-items:center; margin-bottom:12px; padding-left:96px; gap:0;">
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="8">
          <div style="flex:1; text-align:center; font-size:11px; font-weight:600; color:{{ d.col }};">{{ d.label }}</div>
        </sc-for>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div style="display:flex; align-items:center; gap:0; margin-bottom:9px;">
          <div style="width:96px; flex-shrink:0; font-size:14px; font-weight:500; color:var(--tp);">{{ r.name }}</div>
          <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="8">
            <div style="flex:1; display:flex; justify-content:center;">
              <div style="width:26px; height:26px; border-radius:8px; background:{{ c.bg }}; border:{{ c.border }};"></div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>

    <div style="display:flex; align-items:center; justify-content:center; gap:16px;">
      <div style="display:flex; align-items:center; gap:7px;"><div style="width:14px; height:14px; border-radius:5px; background:{{ legend0 }}; border:1px solid var(--hair);"></div><span style="font-size:13px; color:var(--ts);">None</span></div>
      <div style="display:flex; align-items:center; gap:7px;"><div style="width:14px; height:14px; border-radius:5px; background:{{ legend1 }};"></div><span style="font-size:13px; color:var(--ts);">Mild</span></div>
      <div style="display:flex; align-items:center; gap:7px;"><div style="width:14px; height:14px; border-radius:5px; background:{{ legend2 }};"></div><span style="font-size:13px; color:var(--ts);">Strong</span></div>
    </div>

    <div style="border-radius:24px; background:var(--card); border:1px solid var(--hair); padding:20px; display:flex; flex-direction:column; gap:14px;">
      <div style="font-size:17px; font-weight:600; color:var(--tp);">How are you today?</div>
      <sc-for list="{{ today }}" as="t" hint-placeholder-count="4">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div style="font-size:15px; color:var(--tp);">{{ t.name }}</div>
          <div style="display:flex; gap:7px;">
            <sc-for list="{{ t.opts }}" as="o" hint-placeholder-count="3">
              <div style="width:30px; height:30px; border-radius:9px; background:{{ o.bg }}; border:{{ o.border }};"></div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="flex:1;"></div>
    <div style="text-align:center; font-size:14px; color:var(--ts);">Your symptoms are <b style="color:var(--stage);">trending down</b> — day 12 is lighter than day 3.</div>
  </div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const stage = dark ? '#2DD4BF' : '#0D9488';
    const bg = dark ? '#0B1410' : '#FAFAF9';
    const card = dark ? '#13201C' : '#FFFFFF';
    const tp = dark ? '#ECFDF5' : '#0F172A';
    const ts = dark ? '#9CA8A4' : '#64748B';
    const hair = dark ? 'rgba(255,255,255,0.10)' : 'rgba(15,23,42,0.08)';
    const soft = dark ? 'rgba(45,212,191,0.16)' : 'rgba(13,148,136,0.10)';

    const scale = (sev) => {
      if (sev === 0) return { bg: dark ? 'rgba(255,255,255,0.05)' : 'rgba(15,23,42,0.04)', border: `1px solid ${hair}` };
      if (sev === 1) return { bg: dark ? 'rgba(45,212,191,0.28)' : 'rgba(13,148,136,0.28)', border: 'none' };
      return { bg: stage, border: 'none' };
    };
    const dayLabels = ['6', '7', '8', '9', '10', '11', '12'];
    const days = dayLabels.map((label, i) => ({ label: 'D' + label, col: i === dayLabels.length - 1 ? stage : ts }));

    // severity per symptom over days — generally trending down
    const matrix = {
      'Irritability': [2, 2, 2, 1, 1, 1, 0],
      'Brain fog':    [2, 2, 1, 1, 1, 0, 1],
      'Insomnia':     [1, 2, 1, 1, 0, 0, 0],
      'Anxiety':      [2, 1, 1, 1, 1, 0, 0],
      'Cravings':     [2, 2, 2, 1, 1, 1, 1],
    };
    const rows = Object.entries(matrix).map(([name, sevs]) => ({
      name, cells: sevs.map(s => scale(s)),
    }));

    const todayData = [['Irritability', 0], ['Brain fog', 1], ['Insomnia', 0], ['Anxiety', 0]];
    const today = todayData.map(([name, picked]) => ({
      name,
      opts: [0, 1, 2].map(s => {
        const on = s === picked;
        const sc = scale(s);
        return on
          ? { bg: s === 0 ? (dark ? 'rgba(255,255,255,0.12)' : 'rgba(15,23,42,0.10)') : sc.bg, border: `2px solid ${stage}` }
          : { bg: sc.bg, border: sc.border };
      }),
    }));

    return {
      dark, bg, card, stage, tp, ts, hair, soft, days, rows, today,
      legend0: scale(0).bg, legend1: scale(1).bg, legend2: scale(2).bg,
    };
  }
}
</script>
</body>
</html>
