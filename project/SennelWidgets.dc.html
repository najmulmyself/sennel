<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
</helmet>
<x-import component="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="402px,874px">

  <sc-if value="{{ isLock }}" hint-placeholder-val="{{ true }}">
    <div style="--stage:{{ stage }}; height:100%; box-sizing:border-box; background:{{ wall }}; padding:54px 22px 30px; display:flex; flex-direction:column; align-items:center; font-family:-apple-system,system-ui,sans-serif; color:#fff; overflow:hidden; position:relative;">

      <div style="display:flex; align-items:center; gap:8px; margin-top:8px; padding:7px 16px; border-radius:99px; background:rgba(0,0,0,0.28); backdrop-filter:blur(8px);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="16" height="12" rx="4" stroke="#fff" stroke-width="1.6" opacity=".7"/><path d="M8 10v4M16 10v4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".7"/></svg>
        <span style="font-size:13px; font-weight:600; opacity:.85;">Sennel · interval reminder on</span>
      </div>

      <div style="margin-top:18px; text-align:center;">
        <div style="font-size:17px; font-weight:600; opacity:.85;">Monday, June 22</div>
        <div style="font-family:'Nunito',sans-serif; font-weight:800; font-size:84px; line-height:1; letter-spacing:-.02em; text-shadow:0 2px 20px rgba(0,0,0,.25);">9:41</div>
      </div>

      <div style="display:flex; gap:14px; margin-top:22px; width:100%; justify-content:center;">
        <div style="width:86px; height:86px; border-radius:20px; background:rgba(0,0,0,0.30); backdrop-filter:blur(14px); display:flex; align-items:center; justify-content:center; position:relative;">
          <svg width="62" height="62" viewBox="0 0 62 62"><circle cx="31" cy="31" r="24" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="5"/><circle cx="31" cy="31" r="24" fill="none" stroke="{{ stage }}" stroke-width="5" stroke-linecap="round" stroke-dasharray="113 200" transform="rotate(135 31 31)"/></svg>
          <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;"><div style="font-family:'Nunito',sans-serif; font-weight:800; font-size:22px;">12</div><div style="font-size:9px; font-weight:700; letter-spacing:.1em; opacity:.7;">DAYS</div></div>
        </div>
        <div style="flex:1; max-width:200px; height:86px; border-radius:20px; background:rgba(0,0,0,0.30); backdrop-filter:blur(14px); padding:14px 16px; display:flex; flex-direction:column; justify-content:center; gap:7px;">
          <div style="font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; opacity:.7;">Next pouch</div>
          <div style="font-family:'Nunito',sans-serif; font-weight:800; font-size:24px; line-height:1;">4:30 PM</div>
          <div style="height:5px; border-radius:99px; background:rgba(255,255,255,0.2); overflow:hidden;"><div style="height:100%; width:62%; border-radius:99px; background:{{ stage }};"></div></div>
        </div>
      </div>

      <div style="flex:1;"></div>

      <div style="width:100%; border-radius:24px; background:rgba(0,0,0,0.34); backdrop-filter:blur(18px); padding:16px 18px; display:flex; align-items:center; gap:14px; border:1px solid rgba(255,255,255,0.10);">
        <div style="width:46px; height:46px; border-radius:13px; background:{{ iconGrad }}; position:relative; flex-shrink:0;">
          <svg width="46" height="46" viewBox="0 0 46 46" style="position:absolute; inset:0;"><circle cx="23" cy="23" r="14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="66 120" transform="rotate(135 23 23)"/><circle cx="13.2" cy="32.8" r="4.6" fill="#fff"/><circle cx="32" cy="12" r="2.7" fill="#fff"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-size:13px; font-weight:600; opacity:.7;">Live Activity · counting down</div>
          <div style="font-size:17px; font-weight:700; margin-top:2px;">Next pouch in 1h 12m</div>
        </div>
        <div style="font-family:'Nunito',sans-serif; font-weight:800; font-size:26px; color:{{ stage }};">1:12</div>
      </div>

      <div style="margin-top:18px; width:130px; height:5px; border-radius:99px; background:rgba(255,255,255,0.55);"></div>
    </div>
  </sc-if>

  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}">
    <div style="--stage:{{ stage }}; height:100%; box-sizing:border-box; background:{{ wall }}; padding:50px 22px 26px; display:flex; flex-direction:column; align-items:center; font-family:-apple-system,system-ui,sans-serif; color:#fff; overflow:hidden; position:relative;">

      <div style="display:flex; align-items:center; gap:10px; padding:8px 18px 8px 14px; border-radius:99px; background:#000; box-shadow:0 4px 14px rgba(0,0,0,.4);">
        <div style="width:30px; height:30px; border-radius:9px; background:{{ iconGrad }}; position:relative; flex-shrink:0;">
          <svg width="30" height="30" viewBox="0 0 30 30" style="position:absolute; inset:0;"><circle cx="15" cy="15" r="9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="42 80" transform="rotate(135 15 15)"/><circle cx="8.6" cy="21.4" r="3" fill="#fff"/></svg>
        </div>
        <div style="display:flex; flex-direction:column;"><span style="font-size:11px; opacity:.6;">Next pouch</span><span style="font-size:14px; font-weight:700;">in 1h 12m</span></div>
        <div style="width:34px; height:34px; margin-left:4px; position:relative;"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="13" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3.5"/><circle cx="17" cy="17" r="13" fill="none" stroke="{{ stage }}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="50 90" transform="rotate(-90 17 17)"/></svg></div>
      </div>

      <div style="margin-top:34px; width:100%; display:flex; flex-direction:column; gap:16px; align-items:center;">
        <div style="width:100%; border-radius:26px; background:rgba(255,255,255,0.10); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,0.14); padding:20px 22px; display:flex; align-items:center; gap:20px;">
          <div style="position:relative; width:108px; height:108px; flex-shrink:0;">
            <svg width="108" height="108" viewBox="0 0 108 108"><circle cx="54" cy="54" r="42" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="9" stroke-linecap="round" stroke-dasharray="198 400" transform="rotate(135 54 54)"/><circle cx="54" cy="54" r="42" fill="none" stroke="{{ stage }}" stroke-width="9" stroke-linecap="round" stroke-dasharray="109 400" transform="rotate(135 54 54)"/></svg>
            <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;"><div style="font-family:'Nunito',sans-serif; font-weight:800; font-size:38px; line-height:.9; color:{{ stage }};">12</div><div style="font-size:10px; font-weight:700; letter-spacing:.14em; opacity:.7;">DAYS</div></div>
          </div>
          <div style="flex:1; display:flex; flex-direction:column; gap:14px;">
            <div><div style="font-size:13px; opacity:.65;">Saved</div><div style="font-family:'Nunito',sans-serif; font-weight:800; font-size:28px; line-height:1;">$137</div></div>
            <div><div style="font-size:13px; opacity:.65;">Today</div><div style="font-family:'Nunito',sans-serif; font-weight:800; font-size:28px; line-height:1;">3 <span style="font-size:16px; opacity:.6;">of 8</span></div></div>
          </div>
        </div>

        <div style="display:flex; gap:16px; width:100%;">
          <div style="width:120px; height:120px; border-radius:26px; background:{{ iconGrad }}; position:relative; flex-shrink:0; box-shadow:0 10px 26px rgba(4,120,87,.3);">
            <svg width="120" height="120" viewBox="0 0 120 120" style="position:absolute; inset:0;"><circle cx="60" cy="60" r="36" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="170 300" transform="rotate(135 60 60)"/><circle cx="34.5" cy="85.5" r="11.5" fill="#fff"/><circle cx="82" cy="33" r="6.5" fill="#fff"/></svg>
          </div>
          <div style="flex:1; border-radius:26px; background:rgba(255,255,255,0.10); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,0.14); padding:16px 18px; display:flex; flex-direction:column; justify-content:center; gap:6px;">
            <div style="font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; opacity:.65;">Next pouch</div>
            <div style="font-family:'Nunito',sans-serif; font-weight:800; font-size:30px; line-height:1;">4:30<span style="font-size:16px; opacity:.6;"> PM</span></div>
            <div style="height:6px; border-radius:99px; background:rgba(255,255,255,0.2); overflow:hidden; margin-top:2px;"><div style="height:100%; width:62%; border-radius:99px; background:{{ stage }};"></div></div>
          </div>
        </div>
      </div>

      <div style="flex:1;"></div>
      <div style="font-size:13px; opacity:.55;">Home Screen &amp; Lock Screen widgets · WidgetKit</div>
    </div>
  </sc-if>

</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;lock&quot;,&quot;options&quot;:[&quot;lock&quot;,&quot;home&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const view = this.props.view ?? 'lock';
    const stage = '#2DD4BF';
    return {
      isLock: view === 'lock',
      isHome: view === 'home',
      stage,
      wall: 'radial-gradient(120% 90% at 50% 8%, #0E3A33 0%, #0A2620 42%, #06120F 100%)',
      iconGrad: 'linear-gradient(150deg, #2DD4BF, #047857)',
    };
  }
}
</script>
</body>
</html>
