<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<x-import component="IOSDevice" from="./ios-frame.jsx" dark="{{ dark }}" hint-size="402px,874px">
  <div style="--bg:{{ bg }}; --card:{{ card }}; --stage:{{ stage }}; --tp:{{ tp }}; --ts:{{ ts }}; --hair:{{ hair }}; --soft:{{ soft }}; --track:{{ track }}; height:100%; box-sizing:border-box; background:var(--bg); padding:58px 22px 30px; display:flex; flex-direction:column; gap:16px; font-family:-apple-system,system-ui,sans-serif; overflow:hidden;">

    <div style="display:flex; align-items:flex-end; justify-content:space-between;">
      <div>
        <div style="font-size:34px; font-weight:700; letter-spacing:-.01em; color:var(--tp);">Insights</div>
        <div style="font-size:15px; color:var(--ts); margin-top:2px;">Last 30 days</div>
      </div>
      <div style="display:flex; gap:6px; padding:4px; border-radius:12px; background:var(--track);">
        <div style="padding:6px 12px; border-radius:9px; font-size:13px; font-weight:600; background:var(--card); color:var(--tp); box-shadow:0 1px 3px rgba(0,0,0,.08);">30D</div>
        <div style="padding:6px 12px; border-radius:9px; font-size:13px; font-weight:600; color:var(--ts);">7D</div>
      </div>
    </div>

    <div style="border-radius:24px; background:var(--card); border:1px solid var(--hair); padding:20px;">
      <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px;">
        <div style="font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ts);">Pouches per day</div>
        <div style="display:flex; align-items:center; gap:5px; font-size:14px; font-weight:700; color:var(--stage);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7l7 7 4-4 5 5" stroke="{{ stage }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 15V9h-6" stroke="{{ stage }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Down 38%
        </div>
      </div>
      <div style="display:flex; align-items:flex-end; gap:5px; height:120px;">
        <sc-for list="{{ chart }}" as="c" hint-placeholder-count="14">
          <div style="flex:1; border-radius:4px 4px 2px 2px; background:{{ c.col }}; height:{{ c.h }};"></div>
        </sc-for>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:var(--ts);">
        <span>4 wks ago</span><span>2 wks ago</span><span>Today</span>
      </div>
    </div>

    <div style="display:flex; gap:14px;">
      <div style="flex:1; border-radius:20px; background:var(--card); border:1px solid var(--hair); padding:16px;">
        <div style="font-size:13px; color:var(--ts);">Top trigger</div>
        <div style="font-family:'Nunito',sans-serif; font-weight:800; font-size:22px; color:var(--tp); margin-top:4px;">After meals</div>
        <div style="font-size:13px; color:var(--stage); margin-top:2px;">34% of cravings</div>
      </div>
      <div style="flex:1; border-radius:20px; background:var(--card); border:1px solid var(--hair); padding:16px;">
        <div style="font-size:13px; color:var(--ts);">Avg craving</div>
        <div style="font-family:'Nunito',sans-serif; font-weight:800; font-size:22px; color:var(--tp); margin-top:4px;">3.2 <span style="font-size:15px; color:var(--ts);">/ 5</span></div>
        <div style="font-size:13px; color:var(--stage); margin-top:2px;">Down from 4.1</div>
      </div>
    </div>

    <div style="border-radius:24px; background:var(--card); border:1px solid var(--hair); padding:20px;">
      <div style="font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ts); margin-bottom:16px;">Cravings by time of day</div>
      <div style="display:flex; align-items:flex-end; gap:7px; height:70px;">
        <sc-for list="{{ tod }}" as="t" hint-placeholder-count="6">
          <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
            <div style="width:100%; border-radius:6px; background:{{ t.col }}; height:{{ t.h }};"></div>
            <div style="font-size:11px; font-weight:600; color:{{ t.labelCol }};">{{ t.label }}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="flex:1;"></div>
    <div style="text-align:center; font-size:14px; color:var(--ts);">Your <b style="color:var(--stage);">2–4 PM dip</b> is the moment to plan for.</div>
  </div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const stage = dark ? '#2DD4BF' : '#0D9488';
    const bg = dark ? '#0B1410' : '#FAFAF9';
    const card = dark ? '#13201C' : '#FFFFFF';
    const tp = dark ? '#ECFDF5' : '#0F172A';
    const ts = dark ? '#9CA8A4' : '#64748B';
    const hair = dark ? 'rgba(255,255,255,0.10)' : 'rgba(15,23,42,0.08)';
    const soft = dark ? 'rgba(45,212,191,0.16)' : 'rgba(13,148,136,0.10)';
    const track = dark ? 'rgba(255,255,255,0.08)' : 'rgba(15,23,42,0.06)';
    const faint = dark ? 'rgba(45,212,191,0.30)' : 'rgba(13,148,136,0.28)';

    // 14 days trending down
    const vals = [8, 8, 7, 8, 7, 6, 7, 6, 5, 5, 4, 5, 3, 3];
    const max = 8;
    const chart = vals.map((v, i) => ({
      h: Math.round(v / max * 100) + '%',
      col: i >= vals.length - 3 ? stage : faint,
    }));

    const todData = [['6a', 30], ['9a', 55], ['12p', 65], ['3p', 100], ['6p', 70], ['9p', 45]];
    const peak = Math.max(...todData.map(d => d[1]));
    const tod = todData.map(([label, v]) => ({
      label, h: v + '%',
      col: v === peak ? stage : faint,
      labelCol: v === peak ? stage : ts,
    }));

    return { dark, bg, card, stage, tp, ts, hair, soft, track, chart, tod };
  }
}
</script>
</body>
</html>
