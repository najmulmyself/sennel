<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<x-import component="IOSDevice" from="./ios-frame.jsx" dark="{{ dark }}" hint-size="402px,874px">
  <div style="--bg:{{ bg }}; --card:{{ card }}; --stage:{{ stage }}; --tp:{{ tp }}; --ts:{{ ts }}; --hair:{{ hair }}; --soft:{{ soft }}; height:100%; box-sizing:border-box; background:var(--bg); padding:58px 22px 30px; display:flex; flex-direction:column; gap:18px; font-family:-apple-system,system-ui,sans-serif; overflow:hidden;">

    <div>
      <div style="font-size:34px; font-weight:700; letter-spacing:-.01em; color:var(--tp);">Milestones</div>
      <div style="font-size:15px; color:var(--ts); margin-top:2px;">7 of 15 earned</div>
    </div>

    <div style="position:relative; border-radius:24px; overflow:hidden; padding:22px; background:var(--card); border:1px solid var(--hair); display:flex; align-items:center; gap:18px; box-shadow:0 12px 30px var(--soft);">
      <div style="position:absolute; inset:0; background:linear-gradient(150deg, var(--soft), transparent 65%); pointer-events:none;"></div>
      <div style="position:relative; width:78px; height:78px; flex-shrink:0;">
        <div style="position:absolute; inset:0; border-radius:50%; background:var(--stage); box-shadow:0 8px 22px var(--soft);"></div>
        <svg width="78" height="78" viewBox="0 0 78 78" style="position:absolute; inset:0;"><circle cx="39" cy="39" r="25" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="118 200" transform="rotate(135 39 39)"/><circle cx="21.3" cy="56.7" r="8" fill="#fff"/><circle cx="55" cy="20" r="4.5" fill="#fff"/></svg>
      </div>
      <div style="position:relative; flex:1;">
        <div style="font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--stage);">Just earned</div>
        <div style="font-size:22px; font-weight:700; color:var(--tp); margin-top:3px;">Two Weeks Strong</div>
        <div style="font-size:14px; color:var(--ts); margin-top:3px;">14 days clean. The hardest part is behind you.</div>
      </div>
    </div>

    <div style="flex:1; overflow:hidden;">
      <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;">
        <sc-for list="{{ badges }}" as="b" hint-placeholder-count="9">
          <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
            <div style="width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:{{ b.bg }}; border:{{ b.border }}; box-shadow:{{ b.shadow }};">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M12 21c5-2 8-6 8-11V5l-8-2-8 2v5c0 5 3 9 8 11z" fill="{{ b.leafFill }}" stroke="{{ b.leafStroke }}" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 6v9M9 9l3 3 3-3" stroke="{{ b.veinStroke }}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div style="font-size:12px; font-weight:600; text-align:center; line-height:1.2; color:{{ b.titleCol }};">{{ b.title }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const stage = dark ? '#2DD4BF' : '#0D9488';
    const emerald = dark ? '#10B981' : '#047857';
    const bg = dark ? '#0B1410' : '#FAFAF9';
    const card = dark ? '#13201C' : '#FFFFFF';
    const tp = dark ? '#ECFDF5' : '#0F172A';
    const ts = dark ? '#9CA8A4' : '#64748B';
    const hair = dark ? 'rgba(255,255,255,0.10)' : 'rgba(15,23,42,0.08)';
    const soft = dark ? 'rgba(45,212,191,0.16)' : 'rgba(13,148,136,0.10)';
    const lockBg = dark ? 'rgba(255,255,255,0.05)' : 'rgba(15,23,42,0.04)';

    const data = [
      ['First Day', true], ['3 Days', true], ['One Week', true],
      ['Two Weeks', true], ['$50 Saved', true], ['$100 Saved', true],
      ['10 Resisted', true], ['One Month', false], ['$250 Saved', false],
      ['50 Days', false], ['Under Limit', false], ['Breathe 10x', false],
    ];
    const badges = data.map(([title, earned]) => ({
      title,
      bg: earned ? stage : lockBg,
      border: earned ? 'none' : `1.5px solid ${hair}`,
      shadow: earned ? `0 6px 16px ${soft}` : 'none',
      leafFill: earned ? 'rgba(255,255,255,0.92)' : 'transparent',
      leafStroke: earned ? 'rgba(255,255,255,0.92)' : ts,
      veinStroke: earned ? stage : ts,
      titleCol: earned ? tp : ts,
    }));
    return { dark, bg, card, stage, tp, ts, hair, soft, badges };
  }
}
</script>
</body>
</html>
